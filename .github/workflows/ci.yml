name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codearena
          POSTGRES_PASSWORD: codearena
          POSTGRES_DB: codearena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codearena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://codearena:codearena@localhost:5432/codearena
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-real-use-32chars
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-real-use-32chars
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npm run db:migrate -w packages/database

      - name: Typecheck
        run: npm run typecheck

      - name: Pull judge runtime images
        # Pre-pulled so the judge-worker's Docker-execution tests (which
        # otherwise skip themselves when Docker isn't available) don't spend
        # their per-test timeout waiting on a cold pull. GitHub-hosted
        # runners always have a Docker daemon available.
        run: |
          docker pull python:3.12-slim
          docker pull node:20-slim
          docker pull gcc:13

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f infrastructure/docker/api.Dockerfile -t codearena-api:ci .

      - name: Build judge-worker image
        run: docker build -f infrastructure/docker/judge-worker.Dockerfile -t codearena-judge-worker:ci .

      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t codearena-web:ci .
